name: Build PS2 ELF
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:latest make
      - uses: actions/upload-artifact@v4
        with:
          name: zona_de_tiro
          path: zona_de_tiro.elf
